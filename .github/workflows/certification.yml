name: Control certification checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control_certification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: control_certification/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python audit_finite_power_study.py --output ../ci-certification/audit.json
      - run: python -m examples.finite_power_study --replay-from evidence/finite_power_study --output-dir ../ci-certification/replay
