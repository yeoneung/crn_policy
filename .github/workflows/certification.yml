name: Control certification checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control_certification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: control_certification/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s reproducibility/crn_policy/tests -v
      - run: python reproducibility/crn_policy/reproduce.py tests --work-dir ../ci-certification/legacy-tests
      - run: python supplementary_records/audit.py
      - run: python supplementary_records/pendulum_audit.py --output ../ci-certification/regulation.json
      - run: python audit_finite_power_study.py --output ../ci-certification/finite-power.json
      - run: python -m examples.finite_power_study --replay-from evidence/finite_power_study --output-dir ../ci-certification/replay
      - run: python prepare_sources.py --mode fresh --output ../ci-certification/fresh-sources
